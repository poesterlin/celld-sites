# celld-sites: Workers-style sites (SvelteKit, Nuxt, TanStack Start, static)
# served by one celld node, each in its own Dynamic Worker isolate, picked by
# the Host header.
# Site code, assets and Durable Object data live in the S3 bucket below.
#
# This is the development stack: it builds the images locally and uses the
# default `celld-sites-node` image tag. Production
# runs the pull-only compose file in the celld-sites-deploy repo, which uses the
# same project name so volumes carry over; see README, "Development vs hosting".
# Both must not run at the same time.

name: celld-sites

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # S3-compatible object store (VersityGW, posix backend) holding celld's state:
  # deployments, site code and assets, and all Durable Object data. Objects are
  # plain files in the s3-data volume, so the VM backup covers them.
  s3:
    image: versity/versitygw:v1.10.0
    restart: unless-stopped
    environment:
      VGW_BACKEND: posix
      VGW_BACKEND_ARG: /data
      # Flush each object to disk before acknowledging it. celld confirms a write
      # only once the bucket has it, so without this a VM crash could lose writes
      # celld already confirmed.
      VGW_FSYNC: ${S3_FSYNC:-true}
      ROOT_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY in .env}
      ROOT_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in .env}
    volumes:
      - s3-data:/data
    mem_limit: 1g
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      # Unauthenticated requests get 403; any HTTP answer means the gateway is up.
      test: ["CMD-SHELL", "wget -S -O /dev/null http://127.0.0.1:7070/ 2>&1 | grep -q 'HTTP/'"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging: *logging
    networks:
      - default

  # One celld node running the host-header router (router/index.ts). On every
  # start it creates the bucket if needed, deploys the router and starts the
  # node. No site is bundled: deploy them with tools/deploy.sh.
  celld:
    build:
      context: .
      dockerfile: node/Dockerfile
      target: hosting
    image: celld-sites-node
    restart: unless-stopped
    init: true
    depends_on:
      s3:
        condition: service_healthy
        restart: true
    environment:
      CELLD_BUCKET: s3://celld
      S3_ENDPOINT: http://s3:7070
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      ADMIN_TOKEN: ${ADMIN_TOKEN:?Set ADMIN_TOKEN in .env}
      # Read-only admin API (overview, node state) for the dashboard; cannot deploy.
      READ_TOKEN: ${READ_TOKEN:?Set READ_TOKEN in .env}
      # The admin API answers only on this hostname, which Traefik never routes.
      ADMIN_HOST: admin.internal
      # Sign-in for sites that declare `auth` in celld.json; unset = those sites answer 503.
      AUTH_URL: ${AUTH_URL:-}
      AUTH_KEY: ${AUTH_KEY:-}
      # Delete write-log epochs no restore needs once they are this old (epoch GC,
      # a pass at most every 5 min). Covers the router's KV (site code and assets)
      # and its root objects. celld 0.6.3 skips Durable Object facets, so site
      # object logs still grow (~4-6 KB per write); see README.
      CELLD_LTX_RETENTION_SECS: ${CELLD_LTX_RETENTION_SECS:-3600}
      # Wall-clock limit for a site's response and each Durable Object call (504 after).
      SITE_TIMEOUT_SECS: ${SITE_TIMEOUT_SECS:-30}
      # Per-site limits: concurrent requests in one router isolate (503 above),
      # Durable Objects a site may create, and subrequests (object calls plus
      # egress fetches) one request may make.
      SITE_MAX_INFLIGHT: ${SITE_MAX_INFLIGHT:-128}
      SITE_MAX_OBJECTS: ${SITE_MAX_OBJECTS:-1000}
      SITE_MAX_SUBREQUESTS: ${SITE_MAX_SUBREQUESTS:-1000}
      # Per-isolate V8 heap limit (celld's default is 128 MB, Cloudflare's DO
      # limit). A loaded EmDash site is ~120 MB, so a query's result set could
      # tip it over, and an isolate over the limit stops materializing result
      # sets ("the isolate is over its V8 heap limit").
      CELLD_V8_HEAP_LIMIT_MB: ${CELLD_V8_HEAP_LIMIT_MB:-256}
      # Hamstr grains (sites named grain-*) answer only requests that carry this
      # token, i.e. only the Hamstr proxy. Empty: grain sites answer nobody.
      PROXY_TOKEN: ${HAMSTR_PROXY_TOKEN:-}
    # celld's local working copy (SQLite, replication); the bucket is the source
    # of truth, this just saves re-downloading objects after a restart.
    volumes:
      - celld-state:/var/lib/celld
    # Each loaded site isolate stays resident; an EmDash site takes ~120 MB
    # (tools/deploy-emdash.sh), small sites a few MB. celld sheds Durable Objects
    # at 80% of this limit.
    mem_limit: ${CELLD_MEM_LIMIT:-8g}
    # celld drains for up to 40 s (CELLD_SHUTDOWN_TOTAL_MS) before it exits.
    stop_grace_period: 50s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8080/.well-known/celld/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 60s
    logging: *logging
    networks:
      default:
        # The dashboard reaches the admin API as http://admin.internal:8080, so
        # the Host header matches; this name exists only on the project network.
        aliases:
          - admin.internal
      traefik_web: {}
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=traefik_web'
      # LAN only: the hostnames are not in the Cloudflare tunnel. SITES_RULE in
      # .env should match every site hostname (a HostRegexp, see .env.example),
      # so new sites and aliases need no container restart; the router answers
      # 404 for names without a site.
      - 'traefik.http.routers.celld-sites.rule=${SITES_RULE:-Host(`${HOST_DOMAIN}`)}'
      # This Traefik defaults to v2 rule syntax, where HostRegexp takes {name:re}
      # patterns and an anchored regexp silently matches nothing.
      - 'traefik.http.routers.celld-sites.ruleSyntax=v3'
      # Below every ordinary Host() router (Traefik defaults to the rule length),
      # so a wide pattern never takes over another service's hostname (e.g. the
      # dashboard); above static-host's priority-1 catch-all.
      - 'traefik.http.routers.celld-sites.priority=10'
      # gzip/br/zstd for text only; images and fonts are compressed already.
      - 'traefik.http.middlewares.celld-sites-compress.compress.includedContentTypes=text/html,text/css,text/javascript,text/plain,application/javascript,application/json,application/xml,image/svg+xml,application/manifest+json,application/wasm'
      - 'traefik.http.routers.celld-sites.middlewares=celld-sites-compress'
      - 'traefik.http.services.celld-sites.loadbalancer.server.port=8080'

  # Disposable celld node for interactive store demos. It has its own bucket,
  # state volume and admin token; production site data is never reachable from
  # it. The store deploys a demo site, iframes it for a few minutes, then deletes
  # it. LAN-only until demo-* is added to the tunnel (wildcard). Part of the
  # store, so it only runs with the "store" profile.
  celld-demo:
    profiles: ["store"]
    build:
      context: .
      dockerfile: node/Dockerfile
      target: hosting
    image: celld-sites-node:demo
    restart: unless-stopped
    init: true
    depends_on:
      s3:
        condition: service_healthy
        restart: true
    environment:
      CELLD_BUCKET: s3://celld-demo
      S3_ENDPOINT: http://s3:7070
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      ADMIN_TOKEN: ${DEMO_ADMIN_TOKEN:?Set DEMO_ADMIN_TOKEN in .env}
      READ_TOKEN: ${DEMO_READ_TOKEN:?Set DEMO_READ_TOKEN in .env}
      ADMIN_HOST: demo-admin.internal
      SITE_TIMEOUT_SECS: 20
      SITE_MAX_INFLIGHT: 32
      SITE_MAX_OBJECTS: 100
      SITE_MAX_SUBREQUESTS: 100
      CELLD_V8_HEAP_LIMIT_MB: 128
      CELLD_LTX_RETENTION_SECS: 1800
    volumes:
      - demo-state:/var/lib/celld
    mem_limit: 2g
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8080/.well-known/celld/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 60s
    logging: *logging
    networks:
      default:
        aliases:
          - demo-admin.internal
      traefik_web: {}
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=traefik_web'
      - 'traefik.http.routers.celld-demo.rule=HostRegexp(`^demo-[a-z0-9]+[.]${STORE_DEMO_DOMAIN:-example.com}$`)'
      - 'traefik.http.routers.celld-demo.ruleSyntax=v3'
      - 'traefik.http.routers.celld-demo.priority=10'
      - 'traefik.http.services.celld-demo.loadbalancer.server.port=8080'

  # Read-only dashboard behind HTTP Basic auth (DASHBOARD_PASSWORD); LAN-only
  # (not in the Cloudflare tunnel). It can't change anything: GET routes only, a
  # read-only token for the router's admin API. It mounts the bucket read-only
  # to measure storage sizes, which is why it needs the login.
  dashboard:
    build: ./dashboard
    image: celld-sites-dashboard
    restart: unless-stopped
    init: true
    depends_on:
      - celld
    environment:
      READ_TOKEN: ${READ_TOKEN}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:?Set DASHBOARD_PASSWORD in .env (openssl rand -hex 24)}
      BUCKET_DIR: /bucket/celld
      PORT: 3000
    volumes:
      - s3-data:/bucket:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m
    mem_limit: 256m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      # Traefik only routes healthy containers, so check quickly after a start.
      start_period: 20s
      start_interval: 2s
    logging: *logging
    networks:
      - default
      - traefik_web
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=traefik_web'
      - 'traefik.http.routers.celld-sites-dashboard.rule=Host(`${DASHBOARD_HOST:?Set DASHBOARD_HOST in .env}`)'
      - 'traefik.http.services.celld-sites-dashboard.loadbalancer.server.port=3000'

  # Hamstr Store: the hosted app catalog (see store/README.md). It is not part
  # of a personal Hamstr: personal nodes point HAMSTR_STORE at a store instead.
  # It runs here because this host also operates the store, so it and its demo
  # node are off unless COMPOSE_PROFILES includes "store". It holds metadata
  # and packed bundles, never builds or runs app code, and has no access to the
  # bucket or the celld admin API. LAN-only by default; making it public is a
  # Cloudflare tunnel entry plus STORE_REQUIRE_REVIEW=1.
  store:
    profiles: ["store"]
    build:
      context: .
      dockerfile: store/Dockerfile
    image: celld-sites-store
    restart: unless-stopped
    init: true
    environment:
      PORT: 3000
      STORE_DATA_DIR: /data
      # Enables review, takedown and report handling. Empty disables /admin.
      STORE_ADMIN_TOKEN: ${STORE_ADMIN_TOKEN:-}
      # 1: new releases stay out of the catalog until an admin approves them.
      STORE_REQUIRE_REVIEW: ${STORE_REQUIRE_REVIEW:-0}
      # Interactive demos run on celld-demo, with a separate admin token.
      STORE_DEMO_API: http://demo-admin.internal:8080
      STORE_DEMO_HOST: demo-admin.internal
      STORE_DEMO_ADMIN_TOKEN: ${DEMO_ADMIN_TOKEN:?Set DEMO_ADMIN_TOKEN in .env}
      STORE_DEMO_DOMAIN: ${STORE_DEMO_DOMAIN:-example.com}
      STORE_DEMO_SCHEME: https
      STORE_DEMO_TTL_SECS: ${STORE_DEMO_TTL_SECS:-900}
      STORE_DEMO_MAX: ${STORE_DEMO_MAX:-8}
      STORE_DEMO_PER_HOUR: ${STORE_DEMO_PER_HOUR:-6}
    volumes:
      - store-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=32m
    mem_limit: 512m
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: *logging
    networks:
      - default
      - traefik_web
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=traefik_web'
      - 'traefik.http.routers.store.rule=Host(`${STORE_HOST:-store.example.com}`)'
      - 'traefik.http.routers.store.priority=20'
      - 'traefik.http.services.store.loadbalancer.server.port=3000'

  # Hamstr: the personal app shell (grains, sign-in via tsidp). It holds
  # ADMIN_TOKEN and the proxy token, so it is LAN-only.
  # Off unless COMPOSE_PROFILES includes "hamstr" (see .env.example).
  hamstr:
    profiles: ["hamstr"]
    build:
      context: .
      dockerfile: hamstr/Dockerfile
    image: celld-sites-hamstr
    restart: unless-stopped
    init: true
    environment:
      PORT: 3000
      HAMSTR_DATA: /data
      HAMSTR_HOST: ${HAMSTR_HOST:-hamstr.example.com}
      HAMSTR_GRAIN_DOMAIN: ${HAMSTR_GRAIN_DOMAIN:-example.com}
      HAMSTR_SCHEME: https
      # The Hamstr Store it gets apps from: the one in this stack by default, or
      # any other (HAMSTR_STORE=https://store.hamstr.app in .env).
      HAMSTR_STORE: ${HAMSTR_STORE:-http://store:3000}
      HAMSTR_STORE_PUBLIC: ${HAMSTR_STORE_PUBLIC:-https://${STORE_HOST:-store.example.com}}
      CELLD_ADMIN_API: http://admin.internal:8080
      ADMIN_HOST: admin.internal
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      PROXY_TOKEN: ${HAMSTR_PROXY_TOKEN:-}
      HAMSTR_SECRET: ${HAMSTR_SECRET:-}
      OIDC_ISSUER: ${HAMSTR_OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${HAMSTR_OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${HAMSTR_OIDC_CLIENT_SECRET:-}
      HAMSTR_ADMINS: ${HAMSTR_ADMINS:-}
      HAMSTR_ALLOWED_USERS: ${HAMSTR_ALLOWED_USERS:-}
    volumes:
      - hamstr-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=32m
    mem_limit: 512m
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: *logging
    networks:
      - default
      - traefik_web
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=traefik_web'
      - 'traefik.http.routers.hamstr.rule=Host(`${HAMSTR_HOST:-hamstr.example.com}`)'
      - 'traefik.http.routers.hamstr.priority=20'
      - 'traefik.http.routers.hamstr.service=hamstr'
      # Every grain hostname (grain-<12 chars>.<domain>) goes to Hamstr, never
      # straight to celld. Above celld-sites (10) and static-host's catch-all (1).
      - 'traefik.http.routers.hamstr-grains.rule=${HAMSTR_GRAINS_RULE:-Host(`hamstr-grains.invalid`)}'
      - 'traefik.http.routers.hamstr-grains.ruleSyntax=v3'
      - 'traefik.http.routers.hamstr-grains.priority=20'
      - 'traefik.http.routers.hamstr-grains.service=hamstr'
      - 'traefik.http.services.hamstr.loadbalancer.server.port=3000'

  # Sign-in for sites that declare `auth` in celld.json: logins (OIDC, GitHub,
  # passkeys), people, groups and per-site access. The router only checks the
  # signed cookie this service's handoff produces. It holds ADMIN_TOKEN and
  # AUTH_KEY, so it is LAN-only. Off unless COMPOSE_PROFILES includes "auth".
  auth:
    profiles: ["auth"]
    build:
      context: .
      dockerfile: auth/Dockerfile
    image: celld-sites-auth
    restart: unless-stopped
    init: true
    environment:
      PORT: 3000
      AUTH_DATA: /data
      AUTH_URL: https://${AUTH_HOST:-auth.example.com}
      ORIGIN: https://${AUTH_HOST:-auth.example.com}
      # Required; the service refuses to start without it. Not `:?` here: compose
      # checks that for every service, so it would break the stack for nodes without sign-in.
      AUTH_KEY: ${AUTH_KEY:-}
      CELLD_ADMIN_API: http://admin.internal:8080
      ADMIN_HOST: admin.internal
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      NTFY_URL: ${AUTH_NTFY_URL:-}
      # Seeds the first sign-in provider on a fresh install; afterwards providers
      # are managed on the Providers page and these are ignored.
      OIDC_NAME: ${AUTH_OIDC_NAME:-}
      OIDC_ISSUER: ${AUTH_OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${AUTH_OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${AUTH_OIDC_CLIENT_SECRET:-}
      OIDC_AUTO_APPROVE: ${AUTH_OIDC_AUTO_APPROVE:-0}
    volumes:
      - auth-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m
    mem_limit: 256m
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: *logging
    networks:
      - default
      - traefik_web
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=traefik_web'
      - 'traefik.http.routers.auth.rule=Host(`${AUTH_HOST:-auth.example.com}`)'
      - 'traefik.http.routers.auth.priority=20'
      - 'traefik.http.services.auth.loadbalancer.server.port=3000'

  # tsidp: a Tailscale-backed OIDC provider ("Sign in with Tailscale") for the
  # auth service. Optional; any OIDC issuer works instead. Off unless
  # COMPOSE_PROFILES includes "tsidp". It joins the tailnet as TSIDP_HOSTNAME,
  # so a second copy under the same name would fight with this one.
  tsidp:
    profiles: ["tsidp"]
    build:
      context: https://github.com/tailscale/tsidp.git#8fa860f333d9b0ed7eee66e0c7c08531f743fd16
    image: tsidp:authkey-file
    restart: unless-stopped
    init: true
    environment:
      TAILSCALE_USE_WIP_CODE: 1
      TS_STATE_DIR: /data
      TS_HOSTNAME: ${TSIDP_HOSTNAME:-idp}
      # Funnel publishes the IdP on the public internet. Off unless you choose it
      # (TSIDP_FUNNEL=1): only needed when browsers or the auth service cannot
      # reach the tailnet name.
      TSIDP_USE_FUNNEL: ${TSIDP_FUNNEL:-0}
      TSIDP_ENABLE_STS: 1
      TS_AUTHKEY_FILE: /run/secrets/ts_authkey
    # A loopback listener only for the healthcheck (the container's own network
    # namespace; nothing else can reach it).
    command: ["-local-port", "8081"]
    secrets:
      - ts_authkey
    volumes:
      - tsidp-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/.well-known/openid-configuration"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: *logging

volumes:
  s3-data:
  celld-state:
  # The store's catalog and bundles. The volume keeps its original name, which
  # is only a label: renaming it would mean copying the data.
  store-data:
    name: celld-sites_cubby-data
  demo-state:
  hamstr-data:
  auth-data:
  tsidp-data:

networks:
  traefik_web:
    external: true

secrets:
  # The tailnet auth key for tsidp (a file, so it never shows up in `docker inspect`).
  ts_authkey:
    file: ${TSIDP_AUTHKEY_FILE:-./secrets/ts_authkey}
