# celld-sites: Workers-style sites (SvelteKit, Nuxt, TanStack Start, static)
# served by one celld node, each in its own Dynamic Worker isolate, picked by
# the Host header.
# Site code, assets and Durable Object data live in the S3 bucket below.
#
# This is the development stack: it builds the images locally, bundles the
# example site and uses the default `celld-sites-node` image tag. Production
# runs the pull-only compose file in the celld-sites-deploy repo, which uses the
# same project name so volumes carry over; see README, "Development vs hosting".
# Both must not run at the same time.

name: celld-sites

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # S3-compatible object store (VersityGW, posix backend) holding celld's state:
  # deployments, site code and assets, and all Durable Object data. Objects are
  # plain files in the s3-data volume, so the VM backup covers them.
  s3:
    image: versity/versitygw:v1.10.0
    restart: unless-stopped
    environment:
      VGW_BACKEND: posix
      VGW_BACKEND_ARG: /data
      # Flush each object to disk before acknowledging it. celld confirms a write
      # only once the bucket has it, so without this a VM crash could lose writes
      # celld already confirmed.
      VGW_FSYNC: ${S3_FSYNC:-true}
      ROOT_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY in .env}
      ROOT_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in .env}
    volumes:
      - s3-data:/data
    mem_limit: 1g
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      # Unauthenticated requests get 403; any HTTP answer means the gateway is up.
      test: ["CMD-SHELL", "wget -S -O /dev/null http://127.0.0.1:7070/ 2>&1 | grep -q 'HTTP/'"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging: *logging
    networks:
      - default

  # One celld node running the host-header router (router/index.js). On every
  # start it creates the bucket if needed, deploys the router and starts the
  # node; the bundled example is deployed to ${HOST_DOMAIN} only if that site
  # has no active version yet.
  celld:
    build:
      context: .
      dockerfile: node/Dockerfile
      # The dev target bundles sites/example; the hosting image built by CI does
      # not (node/Dockerfile).
      target: dev
    image: celld-sites-node
    restart: unless-stopped
    init: true
    depends_on:
      s3:
        condition: service_healthy
        restart: true
    environment:
      CELLD_BUCKET: s3://celld
      S3_ENDPOINT: http://s3:7070
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      ADMIN_TOKEN: ${ADMIN_TOKEN:?Set ADMIN_TOKEN in .env}
      # Read-only admin API (overview, node state) for the dashboard; cannot deploy.
      READ_TOKEN: ${READ_TOKEN:?Set READ_TOKEN in .env}
      # The admin API answers only on this hostname, which Traefik never routes.
      ADMIN_HOST: admin.internal
      EXAMPLE_HOST: ${HOST_DOMAIN:?Set HOST_DOMAIN in .env}
      # Delete write-log epochs no restore needs once they are this old (epoch GC,
      # a pass at most every 5 min). Covers the router's KV (site code and assets)
      # and its root objects. celld 0.6.3 skips Durable Object facets, so site
      # object logs still grow (~4-6 KB per write); see README.
      CELLD_LTX_RETENTION_SECS: ${CELLD_LTX_RETENTION_SECS:-3600}
      # Wall-clock limit for a site's response and each Durable Object call (504 after).
      SITE_TIMEOUT_SECS: ${SITE_TIMEOUT_SECS:-30}
      # Per-site limits: concurrent requests in one router isolate (503 above),
      # Durable Objects a site may create, and subrequests (object calls plus
      # egress fetches) one request may make.
      SITE_MAX_INFLIGHT: ${SITE_MAX_INFLIGHT:-128}
      SITE_MAX_OBJECTS: ${SITE_MAX_OBJECTS:-1000}
      SITE_MAX_SUBREQUESTS: ${SITE_MAX_SUBREQUESTS:-1000}
      # Per-isolate V8 heap limit (celld's default is 128 MB, Cloudflare's DO
      # limit). A loaded EmDash site is ~120 MB, so a query's result set could
      # tip it over, and an isolate over the limit stops materializing result
      # sets ("the isolate is over its V8 heap limit").
      CELLD_V8_HEAP_LIMIT_MB: ${CELLD_V8_HEAP_LIMIT_MB:-256}
    # celld's local working copy (SQLite, replication); the bucket is the source
    # of truth, this just saves re-downloading objects after a restart.
    volumes:
      - celld-state:/var/lib/celld
    # Each loaded site isolate stays resident; an EmDash site takes ~120 MB
    # (tools/deploy-emdash.sh), small sites a few MB. celld sheds Durable Objects
    # at 80% of this limit.
    mem_limit: ${CELLD_MEM_LIMIT:-8g}
    # celld drains for up to 40 s (CELLD_SHUTDOWN_TOTAL_MS) before it exits.
    stop_grace_period: 50s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8080/.well-known/celld/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 60s
    logging: *logging
    networks:
      default:
        # The dashboard reaches the admin API as http://admin.internal:8080, so
        # the Host header matches; this name exists only on the project network.
        aliases:
          - admin.internal
      traefik_web: {}
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=traefik_web'
      # LAN only: the hostnames are not in the Cloudflare tunnel. SITES_RULE in
      # .env should match every site hostname (a HostRegexp, see .env.example),
      # so new sites and aliases need no container restart; the router answers
      # 404 for names without a site.
      - 'traefik.http.routers.celld-sites.rule=${SITES_RULE:-Host(`${HOST_DOMAIN}`)}'
      # This Traefik defaults to v2 rule syntax, where HostRegexp takes {name:re}
      # patterns and an anchored regexp silently matches nothing.
      - 'traefik.http.routers.celld-sites.ruleSyntax=v3'
      # Below every ordinary Host() router (Traefik defaults to the rule length),
      # so a wide pattern never takes over another service's hostname (e.g. the
      # dashboard); above static-host's priority-1 catch-all.
      - 'traefik.http.routers.celld-sites.priority=10'
      # gzip/br/zstd for text only; images and fonts are compressed already.
      - 'traefik.http.middlewares.celld-sites-compress.compress.includedContentTypes=text/html,text/css,text/javascript,text/plain,application/javascript,application/json,application/xml,image/svg+xml,application/manifest+json,application/wasm'
      - 'traefik.http.routers.celld-sites.middlewares=celld-sites-compress'
      - 'traefik.http.services.celld-sites.loadbalancer.server.port=8080'

  # Disposable celld node for interactive store demos. It has its own bucket,
  # state volume and admin token; production site data is never reachable from
  # it. The store deploys a demo site, iframes it for a few minutes, then deletes
  # it. LAN-only until demo-* is added to the tunnel (wildcard).
  celld-demo:
    build:
      context: .
      dockerfile: node/Dockerfile
      target: hosting
    image: celld-sites-node:demo
    restart: unless-stopped
    init: true
    depends_on:
      s3:
        condition: service_healthy
        restart: true
    environment:
      CELLD_BUCKET: s3://celld-demo
      S3_ENDPOINT: http://s3:7070
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      ADMIN_TOKEN: ${DEMO_ADMIN_TOKEN:?Set DEMO_ADMIN_TOKEN in .env}
      READ_TOKEN: ${DEMO_READ_TOKEN:?Set DEMO_READ_TOKEN in .env}
      ADMIN_HOST: demo-admin.internal
      SITE_TIMEOUT_SECS: 20
      SITE_MAX_INFLIGHT: 32
      SITE_MAX_OBJECTS: 100
      SITE_MAX_SUBREQUESTS: 100
      CELLD_V8_HEAP_LIMIT_MB: 128
      CELLD_LTX_RETENTION_SECS: 1800
    volumes:
      - demo-state:/var/lib/celld
    mem_limit: 2g
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8080/.well-known/celld/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 60s
    logging: *logging
    networks:
      default:
        aliases:
          - demo-admin.internal
      traefik_web: {}
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=traefik_web'
      - 'traefik.http.routers.celld-demo.rule=HostRegexp(`^demo-[a-z0-9]+[.]${CUBBY_DEMO_DOMAIN:-example.com}$`)'
      - 'traefik.http.routers.celld-demo.ruleSyntax=v3'
      - 'traefik.http.routers.celld-demo.priority=10'
      - 'traefik.http.services.celld-demo.loadbalancer.server.port=8080'

  # Read-only dashboard, no authentication: LAN-only (not in the Cloudflare
  # tunnel). It can't change anything: GET routes only, a read-only token for the
  # router's admin API. It has no access to the bucket (site code and data);
  # storage sizes come from the sizer below.
  dashboard:
    build: ./dashboard
    image: celld-sites-dashboard
    restart: unless-stopped
    init: true
    depends_on:
      - celld
      - sizer
    environment:
      READ_TOKEN: ${READ_TOKEN}
      PORT: 3000
    read_only: true
    tmpfs:
      - /tmp:size=16m
    mem_limit: 256m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      # Traefik only routes healthy containers, so check quickly after a start.
      start_period: 20s
      start_interval: 2s
    logging: *logging
    networks:
      - default
      - traefik_web
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=traefik_web'
      - 'traefik.http.routers.celld-sites-dashboard.rule=Host(`${DASHBOARD_HOST:?Set DASHBOARD_HOST in .env}`)'
      - 'traefik.http.services.celld-sites-dashboard.loadbalancer.server.port=3000'

  # Bucket disk usage for the dashboard: the only container with the bucket volume
  # (read-only). Serves sizes only (GET /sizes), on the project network; no Traefik
  # route, no token, no file contents.
  sizer:
    # Built by the dashboard service (same image, other entry point).
    image: celld-sites-dashboard
    pull_policy: never
    restart: unless-stopped
    init: true
    command: ["bun", "src/sizer.ts"]
    environment:
      PORT: 3001
    volumes:
      - s3-data:/bucket:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m
    mem_limit: 256m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3001/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 20s
      start_interval: 2s
    logging: *logging
    networks:
      - default

  # Cubby: the public catalog for tiny applets (see cubby/README.md). It holds
  # metadata and packed bundles, never builds or runs app code, and has no
  # access to the bucket or the celld admin API. LAN-only by default; making it
  # public is a Cloudflare tunnel entry plus CUBBY_REQUIRE_REVIEW=1.
  cubby:
    build:
      context: .
      dockerfile: cubby/Dockerfile
    image: celld-sites-cubby
    restart: unless-stopped
    init: true
    environment:
      PORT: 3000
      CUBBY_DATA_DIR: /data
      # Enables review, takedown and report handling. Empty disables /admin.
      CUBBY_ADMIN_TOKEN: ${CUBBY_ADMIN_TOKEN:-}
      # 1: new releases stay out of the catalog until an admin approves them.
      CUBBY_REQUIRE_REVIEW: ${CUBBY_REQUIRE_REVIEW:-0}
      # Interactive demos run on celld-demo, with a separate admin token.
      CUBBY_DEMO_API: http://demo-admin.internal:8080
      CUBBY_DEMO_HOST: demo-admin.internal
      CUBBY_DEMO_ADMIN_TOKEN: ${DEMO_ADMIN_TOKEN:?Set DEMO_ADMIN_TOKEN in .env}
      CUBBY_DEMO_DOMAIN: ${CUBBY_DEMO_DOMAIN:-example.com}
      CUBBY_DEMO_SCHEME: https
      CUBBY_DEMO_TTL_SECS: ${CUBBY_DEMO_TTL_SECS:-900}
      CUBBY_DEMO_MAX: ${CUBBY_DEMO_MAX:-8}
      CUBBY_DEMO_PER_HOUR: ${CUBBY_DEMO_PER_HOUR:-6}
    volumes:
      - cubby-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=32m
    mem_limit: 512m
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: *logging
    networks:
      - default
      - traefik_web
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=traefik_web'
      - 'traefik.http.routers.cubby.rule=Host(`${CUBBY_HOST:-cubby.example.com}`)'
      - 'traefik.http.routers.cubby.priority=20'
      - 'traefik.http.services.cubby.loadbalancer.server.port=3000'

  # Cubby Shelf: the non-technical local UI for installing store apps into this
  # node. Unlike the store it holds ADMIN_TOKEN, so it is LAN-only and never
  # gets a public tunnel entry. See cubby/README.md.
  cubby-shelf:
    build:
      context: .
      dockerfile: cubby/Dockerfile.shelf
    image: celld-sites-cubby-shelf
    restart: unless-stopped
    init: true
    environment:
      PORT: 3000
      CUBBY_STORE: http://cubby:3000
      CUBBY_STORE_PUBLIC: https://${CUBBY_HOST:-cubby.example.com}
      # The celld service's network alias on the default network.
      CELLD_ADMIN_API: http://admin.internal:8080
      ADMIN_HOST: admin.internal
      ADMIN_TOKEN: ${ADMIN_TOKEN:?Set ADMIN_TOKEN in .env}
      CUBBY_APP_DOMAIN: ${CUBBY_APP_DOMAIN:-example.com}
      CUBBY_APP_SCHEME: https
      CUBBY_SHELF_PASSWORD: ${CUBBY_SHELF_PASSWORD:?Set CUBBY_SHELF_PASSWORD in .env}
      CUBBY_SHELF_SECRET: ${CUBBY_SHELF_SECRET:?Set CUBBY_SHELF_SECRET in .env}
    volumes:
      - cubby-shelf-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=256m
    mem_limit: 512m
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: *logging
    networks:
      - default
      - traefik_web
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=traefik_web'
      - 'traefik.http.routers.cubby-shelf.rule=Host(`${CUBBY_SHELF_HOST:-cubby-shelf.example.com}`)'
      - 'traefik.http.routers.cubby-shelf.priority=20'
      - 'traefik.http.services.cubby-shelf.loadbalancer.server.port=3000'

volumes:
  s3-data:
  celld-state:
  cubby-data:
  cubby-shelf-data:
  demo-state:

networks:
  traefik_web:
    external: true
