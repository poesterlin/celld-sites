<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="light dark" />
		<title>Hamstr</title>
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<link rel="stylesheet" href="/style.css" />
	</head>
	<body>
		<header class="bar" id="bar" hidden>
			<a class="brand" href="/" data-link>
				<img src="/favicon.svg" width="30" height="30" alt="" />
				<span>Hamstr</span>
			</a>
			<nav class="nav" aria-label="Main">
				<a href="/" data-link data-nav="home">Home</a>
				<a href="/shared" data-link data-nav="shared">Shared</a>
				<a href="/apps" data-link data-nav="apps">Apps</a>
				<a href="/trash" data-link data-nav="trash">Trash</a>
			</nav>
			<div class="me">
				<button type="button" class="avatar" id="avatar" aria-haspopup="menu" aria-expanded="false"></button>
				<div class="menu" id="menu" role="menu" hidden>
					<div class="menu-head"><strong id="meName"></strong><span class="dim small" id="meEmail"></span></div>
					<form method="post" action="/auth/logout"><button type="submit" class="menu-item" role="menuitem">Sign out</button></form>
				</div>
			</div>
		</header>

		<main id="main" aria-live="polite"></main>

		<div class="scrim" id="scrim" hidden>
			<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
		</div>
		<div class="toast" id="toast" role="status" hidden></div>

		<script src="/app.js" type="module"></script>
	</body>
</html>
