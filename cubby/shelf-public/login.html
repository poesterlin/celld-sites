<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Sign in — Cubby Shelf</title>
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<link rel="stylesheet" href="/style.css" />
	</head>
	<body class="login-page">
		<main class="login">
			<div class="login-card">
				<div class="brand big">
					<svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true"><path d="M4 10.5 16 4l12 6.5v11L16 28 4 21.5z" fill="none" stroke="currentColor" stroke-width="2" /><path d="M4 10.5 16 17l12-6.5M16 17v11" fill="none" stroke="currentColor" stroke-width="2" /></svg>
					<span class="wordmark">cubby</span>
					<span class="brand-tag">node shelf</span>
				</div>
				<h1>This is your node.</h1>
				<p class="dim">Sign in to install little apps into your own celld sandbox.</p>
				<p class="error" id="loginError" hidden>Wrong password. Try again.</p>
				<form method="post" action="/login">
					<label for="password">Operator password</label>
					<input id="password" name="password" type="password" autocomplete="current-password" autofocus required />
					<button class="primary" type="submit">Open the shelf</button>
				</form>
				<p class="dim tiny">The password is <code>CUBBY_SHELF_PASSWORD</code> in this deployment's <code>.env</code>.</p>
			</div>
		</main>
		<script src="/login.js" type="module"></script>
	</body>
</html>
