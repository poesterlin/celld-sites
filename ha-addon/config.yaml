# The Hamstr add-on: the appliance image (appliance/), settings from the
# options below. Bump `version` to a released image tag (git tag vX.Y.Z).
name: Hamstr
version: "0.3.2"
slug: hamstr
description: Little web apps in one click, with your data at home
url: https://github.com/poesterlin/celld-sites
arch:
  - amd64
  - aarch64
image: ghcr.io/poesterlin/celld-sites-appliance
startup: application
boot: auto
init: true
# celld drains for about 15 s when it stops.
timeout: 60
# Home mode opens a port per grain (20000 and up) as grains are made, so the
# add-on shares the host's network instead of mapping fixed ports.
host_network: true
ports:
  8000/tcp: 8000
# The sidebar panel links to Hamstr on the box's own address (appliance/panel.mjs):
# a "web UI" link would reuse Home Assistant's address, which is often HTTPS-only.
ingress: true
ingress_port: 8099
panel_icon: mdi:rodent
panel_title: Hamstr
options:
  store: ""
  auth: none
  tls_mode: "off"
  env: []
schema:
  auth: list(none|required)
  tls_mode: list(off|names|domain)
  domain: str?
  dns_provider: str?
  env:
    - match(^[A-Z_][A-Z0-9_]*=.*$)
  name_service_url: url?
  address: str?
  acme_email: email?
  hamstr_host: str?
  grain_domain: str?
  oidc_name: str?
  oidc_issuer: url?
  oidc_client_id: str?
  oidc_client_secret: password?
  store: str?
