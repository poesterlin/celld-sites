name: test

# Unit suites, integration tests against a real `celld dev` node, the names
# service end to end against Pebble, and the store and Hamstr images.
#
#   unit         store (embedded and real Postgres), moderation, Hamstr, names;
#                the store web UI and the CLI build
#   integration  router API suite, CLI install (from the repo and as a packed
#                npm package run from an empty directory), Hamstr end to end
#   names        names server + agent + Pebble (Let's Encrypt's test CA)
#   appliance    the one-container image: Hamstr, a grain and a site end to end,
#                restarts; HTTPS with the names agent against Pebble
#   images       store and Hamstr images build (never pushed)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

env:
  # Same Node major as the images.
  NODE_VERSION: "24"

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: "**/package-lock.json"
      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund
          for dir in packages/app-format store store/cli store/web hamstr; do
            npm ci --prefix "$dir" --no-audit --no-fund
          done
      - name: Typecheck every package
        run: npm run typecheck
      - name: Store (API, bundles, manifests, web serving, moderation; embedded Postgres)
        run: npm test --prefix store
      - name: Store and moderation on a Postgres server
        run: |
          docker run -d --name store-pg -e POSTGRES_PASSWORD=test -e POSTGRES_DB=store -p 127.0.0.1:5432:5432 postgres:17.6-alpine
          for i in $(seq 30); do docker exec store-pg pg_isready -U postgres -d store && break; sleep 1; done
          docker exec store-pg psql -U postgres -c "CREATE DATABASE moderation"
          STORE_TEST_DATABASE_URL=postgres://postgres:test@127.0.0.1:5432/store node --test store/test/api.test.ts
          STORE_TEST_DATABASE_URL=postgres://postgres:test@127.0.0.1:5432/moderation node --test store/test/moderation.test.ts
      - name: Store web UI builds
        run: npm run build --prefix store/web
      - name: Hamstr (builds, then mock IdP, mock celld, real store)
        run: npm test --prefix hamstr
      - name: Names service
        run: npm test --prefix names/server
      - name: CLI bundles and runs
        run: |
          npm run build --prefix store/cli
          node store/cli/dist/hamstr.mjs --version

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: "**/package-lock.json"
      - name: Install dependencies
        run: |
          for dir in tools packages/app-format store store/cli hamstr; do
            npm ci --prefix "$dir" --no-audit --no-fund
          done
      - name: Install celld (the version the node image uses, copied out of its image)
        run: |
          image=$(grep -oE 'ghcr\.io/denoland/celld:[^ ]+' node/Dockerfile | head -1)
          id=$(docker create "$image")
          mkdir -p "$HOME/.local/bin"
          docker cp "$id:/usr/local/bin/celld" "$HOME/.local/bin/celld"
          docker rm "$id"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/celld" --version
      - name: Router API suite (celld dev)
        run: npm test --prefix tools
      - name: CLI install from the repo (celld dev)
        run: node store/test/e2e-install.ts
      - name: CLI as a packed npm package, from an empty directory (celld dev)
        run: node store/test/e2e-cli-package.ts
      - name: Hamstr end to end (celld dev, real store, real CLI)
        run: npm run e2e --prefix hamstr

  names:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Names server + agent + Pebble
        run: names/agent/test/e2e.sh

  appliance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: "**/package-lock.json"
      - name: Install dependencies (store, CLI, pack, the example site)
        run: |
          for dir in tools packages/app-format store store/cli sites/example; do
            npm ci --prefix "$dir" --no-audit --no-fund
          done
      - name: Build the appliance image
        run: docker build -f appliance/Dockerfile -t celld-appliance .
      - name: End to end (TLS_MODE=off)
        run: node appliance/test/e2e.ts
      - name: HTTPS with the names agent and Pebble
        run: appliance/test/tls.sh

  images:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        dockerfile: [store/Dockerfile, hamstr/Dockerfile, names/server/Dockerfile, names/agent/Dockerfile]
    steps:
      - uses: actions/checkout@v4
      - name: Build ${{ matrix.dockerfile }}
        run: |
          case "${{ matrix.dockerfile }}" in
            names/*) context=$(dirname "${{ matrix.dockerfile }}") ;;
            *) context=. ;;
          esac
          docker build -f "${{ matrix.dockerfile }}" "$context"
